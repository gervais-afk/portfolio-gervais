<!doctype html>
<!-- Source of assets/images/og-card.png (1200×630). Render with scripts/build_og_card.mjs. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Manrope; src: url("../assets/fonts/manrope-latin.woff2") format("woff2"); font-weight: 200 800; }
@font-face { font-family: Newsreader; src: url("../assets/fonts/newsreader-latin-italic.woff2") format("woff2"); font-style: italic; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; background: #f8f6f0; color: #142e3c; font-family: Manrope, sans-serif; }
.grid { position: absolute; inset: 0 0 0 50%; background-image: linear-gradient(#142e3c0b 1px, transparent 1px), linear-gradient(90deg, #142e3c0b 1px, transparent 1px); background-size: 42px 42px; -webkit-mask-image: linear-gradient(90deg, transparent, #000); }
.glow { position: absolute; right: 40px; top: 60px; width: 520px; height: 520px; background: radial-gradient(closest-side, #126b6314, transparent); }
.copy { position: absolute; left: 80px; top: 92px; width: 640px; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 7px 16px; border: 1px solid #cbdacf; border-radius: 30px; background: #eef3e9; color: #345e4e; font-size: 17px; font-weight: 600; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: #126b63; }
.eyebrow { margin-top: 34px; color: #126b63; font-size: 16px; font-weight: 750; letter-spacing: .14em; display: flex; align-items: center; gap: 14px; }
.eyebrow::before { content: ""; width: 34px; height: 1.5px; background: currentColor; }
h1 { margin-top: 18px; font-size: 70px; font-weight: 650; letter-spacing: -.06em; line-height: 1.04; }
h1 em { color: #126b63; font-family: Newsreader, serif; font-weight: 400; font-size: 1.12em; letter-spacing: -.05em; }
.role { margin-top: 30px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.foot { position: absolute; left: 80px; bottom: 56px; display: flex; gap: 26px; align-items: center; color: #53636a; font-size: 17px; font-weight: 600; }
.foot b { color: #142e3c; font-family: Newsreader, serif; font-style: italic; font-weight: 400; font-size: 40px; letter-spacing: -.09em; }
.foot b span { color: #126b63; }
.portrait { position: absolute; right: 80px; top: 70px; width: 330px; height: 440px; padding: 8px; border: 1px solid #c4cfc1; border-radius: 130px 6px 6px 6px; background: #e6e9de; box-shadow: 0 30px 60px -24px #142e3c55; }
.portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center top; border-radius: 122px 2px 2px 2px; }
.arch { position: absolute; right: 68px; top: 58px; width: 262px; height: 330px; border: 1px solid #9aafa1; border-radius: 110px 0 0 0; }
.loc { position: absolute; right: 100px; top: 452px; width: 290px; padding: 12px 14px; background: #f8f6f0ee; border-radius: 3px; font-size: 15px; box-shadow: 0 8px 22px -10px #142e3c55; }
.cross { position: absolute; right: 395px; top: 228px; width: 36px; height: 36px; background: linear-gradient(#126b63, #126b63) center / 1.5px 100% no-repeat, linear-gradient(#126b63, #126b63) center / 100% 1.5px no-repeat; }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="copy">
    <span class="chip"><i></i>À l’écoute d’opportunités IA &amp; Data</span>
    <p class="eyebrow">KOA MARIE GERVAIS NELLY · CAMEROUN</p>
    <h1>Des données aux<br><em>solutions utiles.</em></h1>
    <p class="role">Ingénieur IA &amp; Architecte Data</p>
  </div>
  <div class="arch"></div>
  <div class="portrait"><img src="../assets/images/profile_portrait.webp" alt=""></div>
  <div class="cross"></div>
  <div class="loc">Douala / Ngaoundéré, Cameroun</div>
  <div class="foot"><b>kg<span>.</span></b><span>Recherche documentaire · Automatisation · Analytique</span></div>
</body>
</html>
